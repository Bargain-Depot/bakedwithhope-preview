name: Install clear Banana Pudding photo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-banana-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and reconstruct product photo
        run: |
          python - <<'PY'
          import base64,hashlib
          from pathlib import Path
          encoded=''.join(Path('banana-data-part-%d.txt'%i).read_text().strip() for i in range(1,5))
          image=base64.b64decode(encoded,validate=True)
          expected='10c2f83ac319ca53ee2f622c6ef1989114541a17a8d0ab1c575dce25a3dfa0d0'
          actual=hashlib.sha256(image).hexdigest()
          if actual!=expected:
              raise RuntimeError('Image checksum did not match: '+actual)
          Path('banana-pudding-cake-photo.webp').write_bytes(image)
          print('Verified cutout:', len(image), 'bytes')
          PY
      - name: Publish clear product photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banana-pudding-cake-photo.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add genuine sharper Banana Pudding product photo"
            git pull --rebase origin main
            git push
          fi
